[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detr"
version = "0.1.0"
description = "End-to-End Object Detection with Transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cython",
    "loguru",
    "pycocotools",
    "scipy",
    "submitit",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = ["flake8"]

[project.scripts]
detr-train = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ARG"]
