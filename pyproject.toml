[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "detr"
version = "0.1.0"
description = "End-to-End Object Detection with Transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cython",
    "submitit",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scipy",
    "onnx",
    "onnxruntime",
]

[project.optional-dependencies]
coco = ["pycocotools"]
panoptic = ["panopticapi @ git+https://github.com/cocodataset/panopticapi.git"]
dev = ["flake8"]

[project.scripts]
detr-train = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["detr*"]

[tool.pytest.ini_options]
pythonpath = ["detr"]

[tool.flake8]
max-line-length = 120
ignore = ["F401", "E402", "F403", "W503", "W504"]
