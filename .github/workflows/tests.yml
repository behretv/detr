name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: hmcvlab/computer-vision:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[coco]"
          pip install pytest

      - name: Run pytest
        run: pytest -q
